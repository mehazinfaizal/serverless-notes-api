AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Notes API using API Gateway HTTP API, Lambda, and DynamoDB.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128

Resources:
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  NotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: notes-api
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref NotesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        CreateNote:
          Type: HttpApi
          Properties:
            Path: /notes
            Method: POST
        ListNotes:
          Type: HttpApi
          Properties:
            Path: /notes
            Method: GET
        GetNote:
          Type: HttpApi
          Properties:
            Path: /notes/{id}
            Method: GET
        DeleteNote:
          Type: HttpApi
          Properties:
            Path: /notes/{id}
            Method: DELETE

Outputs:
  NotesApiUrl:
    Description: Invoke URL for the Notes HTTP API
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
